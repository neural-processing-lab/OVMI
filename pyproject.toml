[build-system]
requires = ["setuptools>=61", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ovmi"
version = "0.1.0"
description = "Open-vocabulary mutual information computation and vocabulary optimisation."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [
  { name = "Dulhan Jayalath" }
]
dependencies = [
  "numpy>=1.23",
  "pandas>=2.0"
]

[project.optional-dependencies]
dev = [
  "pytest>=7"
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
