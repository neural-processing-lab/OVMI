[metadata]
name = ovmi
version = 0.1.0
description = Open-vocabulary mutual information computation and vocabulary optimisation.
long_description = file: README.md
long_description_content_type = text/markdown
license = MIT
author = Dulhan Jayalath

[options]
package_dir =
    = src
packages = find:
python_requires = >=3.9
install_requires =
    numpy>=1.23
    pandas>=2.0

[options.packages.find]
where = src
